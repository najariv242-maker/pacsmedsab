services:
  - type: web
    name: medal-pacs-telegram-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: PACS_USERNAME
        value: doc
      - key: PACS_PASSWORD
        value: doc
