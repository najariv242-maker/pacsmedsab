name: Keep Render Bot Awake (Every 5 Minutes)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Health Endpoint
        env:
          RENDER_URL: ${{ secrets.RENDER_EXTERNAL_URL }}
        run: |
          if [ -z "$RENDER_URL" ]; then
            echo "Please set RENDER_EXTERNAL_URL in GitHub Repository Secrets"
            exit 0
          fi
          curl -fsSL --retry 3 --max-time 15 "${RENDER_URL%/}/health"
          echo ""
          echo "Successfully pinged Render bot at $(date -u)"
