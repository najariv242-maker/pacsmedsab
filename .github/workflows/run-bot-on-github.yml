name: Run Medal PACS Bot Directly on GitHub (Free 24/7)

on:
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/run-bot-on-github.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: medal-pacs-telegram-bot-single-runner
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system FFmpeg, Fonts & Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip -q
          pip install --quiet beautifulsoup4 lxml opencv-python-headless numpy pillow requests urllib3
          if [ -f requirements.txt ]; then pip install --quiet -r requirements.txt; fi

      - name: Run Telegram Bot (5.5 Hours Cycle + 3s Instant Hot-Reload)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          PACS_USERNAME: doc
          PACS_PASSWORD: doc
          PACS_PROXY: ${{ secrets.PACS_PROXY }}
          PORT: 7860
          PYTHONUNBUFFERED: "1"
        run: |
          BRANCH="${GITHUB_REF_NAME:-main}"
          START_TIME=$(date +%s)
          MAX_DURATION=20100 # 335 minutes (5.5 hours)

          start_bot() {
            rm -rf /tmp/*.mp4 /tmp/*.zip 2>/dev/null || true
            if [ -f requirements.txt ]; then
              pip install --quiet -r requirements.txt || true
            fi
            echo "🚀 [Hot-Reload] Starting bot.py at commit $(git rev-parse --short HEAD)..."
            python -u bot.py &
            BOT_PID=$!
          }

          stop_bot() {
            if [ -n "${BOT_PID:-}" ]; then
              kill -TERM "$BOT_PID" 2>/dev/null || true
              sleep 1
              kill -9 "$BOT_PID" 2>/dev/null || true
              wait "$BOT_PID" 2>/dev/null || true
            fi
            pkill -9 -f "python -u bot.py" 2>/dev/null || true
          }

          start_bot

          while true; do
            sleep 3

            # ۱. بررسی اتمام سیکل ۵.۵ ساعته (۳۳۵ دقیقه)
            NOW=$(date +%s)
            if [ $((NOW - START_TIME)) -ge $MAX_DURATION ]; then
              echo "⏰ 5.5-hour cycle completed. Handing over to next cycle..."
              stop_bot
              break
            fi

            # ۲. بررسی لحظه‌ای تغییرات در کل مخزن (اضافه، حذف یا ویرایش هر فایل)
            if git fetch origin "$BRANCH" --quiet 2>/dev/null; then
              LOCAL_HASH=$(git rev-parse HEAD)
              REMOTE_HASH=$(git rev-parse "origin/$BRANCH")

              if [ "$LOCAL_HASH" != "$REMOTE_HASH" ]; then
                echo "⚡ [Hot-Reload] Change detected ($LOCAL_HASH -> $REMOTE_HASH)! Updating immediately..."
                stop_bot
                git reset --hard "origin/$BRANCH"
                git clean -fd
                start_bot
                continue
              fi
            fi

            # ۳. محافظ ضد کرش (Watchdog): اگر بات به هر دلیلی متوقف شد، دوباره روشن شود
            if ! kill -0 "$BOT_PID" 2>/dev/null; then
              echo "⚠️ [Watchdog] bot.py exited unexpectedly. Restarting in 5 seconds..."
              sleep 5
              stop_bot
              start_bot
            fi
          done

      - name: Clean Temp Files & Re-Trigger Next Cycle seamlessly
        if: always() && !cancelled() && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf /tmp/*.mp4 /tmp/*.zip || true
          gh workflow run "Run Medal PACS Bot Directly on GitHub (Free 24/7)" --ref "${GITHUB_REF_NAME}" || true
